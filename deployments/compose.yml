name: termlink-local
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: termlink
      POSTGRES_PASSWORD: ${TERMLINK_DB_PASSWORD:?set TERMLINK_DB_PASSWORD for local development}
      POSTGRES_DB: termlink
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U termlink -d termlink']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: ['app']
    user: '${TERMLINK_UID:-1000}:${TERMLINK_GID:-1000}'
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      DATABASE_URL: postgres://termlink:${TERMLINK_DB_PASSWORD}@db:5432/termlink?sslmode=disable
    command: ['--addr', '0.0.0.0:8443', '--tls-cert', '/tls/server.crt', '--tls-key', '/tls/server.key', '--ssh-host-key', '/state/ssh_host_ed25519', '--ssh-addr', '0.0.0.0:2222']
    ports:
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:2222:2222'
    volumes:
      - ../.local/tls:/tls:ro
      - ../.local/ssh:/state
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
