name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: termlink
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: termlink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TERMLINK_TEST_DATABASE_URL: postgres://termlink:test-only@localhost:5432/termlink_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: test -z "$(gofmt -l .)"
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go build ./cmd/...
      - name: Check versioned client builds
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/build-release.ps1
          $release = 'dist/v0.1.0-alpha.1'
          $client = Join-Path $release 'karatty-v0.1.0-alpha.1-windows-amd64.exe'
          if ((& $client version) -ne 'Karatty v0.1.0-alpha.1') { throw 'wrong client version' }
          $hashLines = @(Get-Content (Join-Path $release 'SHA256SUMS'))
          if ($hashLines.Count -ne 5) { throw 'wrong number of checksums' }
          foreach ($line in $hashLines) {
            if ($line -notmatch '^([a-f0-9]{64})  (karatty-v0\.1\.0-alpha\.1-[^/\\]+)$') { throw 'invalid checksum line' }
            $actual = (Get-FileHash (Join-Path $release $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw 'checksum mismatch' }
          }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: bash scripts/docker-smoke.sh
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
